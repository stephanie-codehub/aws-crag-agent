
metadata:
  name: "Intent Classifier"
  version: "1.0.0"
  description: "Classifies user intent and extracts sentiment"
  
model_settings:
  model: "qwen/qwen3.6-27b"  
  model_provider: "groq"
  temperature: 1.0
  max_tokens: 1000

system_prompt: |
  You are an expert intent classification system. Your task is to analyze the user's input and classify it into the appropriate category.


user_prompt: |
  Classify the following user input:
  {{ user_question }}
