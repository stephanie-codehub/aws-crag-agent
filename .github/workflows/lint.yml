name: Lint 

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true


      - name: Run Linter
        run: uvx ruff check .
   

      - name: Run Formatter 
        run: uvx ruff format --check .

