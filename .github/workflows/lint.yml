name: Lint 

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true


      - name: Set up Python
        run: uv python install 3.12

   
      - name: Install Dependencies
        run: uv sync --frozen

    
      - name: Run Linter
        run: uv run ruff check .

      - name: Run Formatter Check
        run: uv run ruff format --check .

